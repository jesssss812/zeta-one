<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Zeta One case review</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #1c1c1a; --muted: #6b6a65; --line: #e4e1d8;
    --chip: #efede6; --accent: #24456b; --amber: #9a5b00; --amber-bg: #fdf3e2; --red: #9b2c2c; --red-bg: #fbeaea;
    --green: #2d6a3e; --green-bg: #e8f4ec; --blue-bg: #e8eff7;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141413; --card: #1d1d1b; --ink: #ecebe6; --muted: #a09f99; --line: #33322e; --chip: #2a2926;
      --accent: #9cc3ec; --amber: #f0b36a; --amber-bg: #2e2416; --red: #f19a9a; --red-bg: #2f1c1c;
      --green: #8fd3a3; --green-bg: #18291e; --blue-bg: #1b2533; }
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, sans-serif; margin: 0; }
  header.bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
    padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--card); position: sticky; top: 0; z-index: 2; }
  header.bar h1 { font-size: 16px; margin: 0; } header.bar .note { margin: 0; }
  main { max-width: 1240px; margin: 0 auto; padding: 16px 20px 40px; }
  .note { color: var(--muted); font-size: 12.5px; }
  input, select, button { font: inherit; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: inherit; }
  button { cursor: pointer; } button.primary { background: var(--accent); color: var(--card); border-color: var(--accent); }
  form.open { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 10px; }
  .hero { display: grid; grid-template-columns: minmax(240px, 1.3fr) repeat(2, minmax(150px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .who { display: flex; gap: 12px; align-items: center; }
  .logo { width: 52px; height: 52px; border-radius: 12px; flex: none; display: grid; place-items: center; overflow: hidden;
    font-weight: 700; font-size: 18px; color: #fff; border: 1px solid var(--line); background: var(--chip); }
  .logo img { width: 36px; height: 36px; }
  .who strong { font-size: 17px; display: block; line-height: 1.2; }
  .kpi .label { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .kpi .value { font-size: 20px; font-weight: 650; margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 9px; font-size: 12px; white-space: nowrap; }
  .badge { display: inline-block; border-radius: 6px; padding: 2px 8px; font-weight: 600; font-size: 13px; }
  .allow { background: var(--green-bg); color: var(--green); } .challenge { background: var(--amber-bg); color: var(--amber); }
  .block { background: var(--red-bg); color: var(--red); } .claim { background: var(--blue-bg); color: var(--accent); }
  .layout { display: grid; grid-template-columns: minmax(0, 2.1fr) minmax(280px, 1fr); gap: 14px; align-items: start; }
  .stack { display: grid; gap: 14px; }
  .side { position: sticky; top: 72px; display: grid; gap: 14px; }
  .lead { font-size: 15.5px; margin: 0 0 12px; }
  .timeline { list-style: none; margin: 0; padding: 0 0 0 16px; border-left: 2px solid var(--line); }
  .timeline li { position: relative; margin: 0 0 10px; padding-left: 10px; }
  .timeline li::before { content: ""; position: absolute; left: -22px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .timeline time { display: block; font-size: 12px; color: var(--muted); }
  .attention { border-color: var(--amber); background: var(--amber-bg); }
  .attention h2 { color: var(--amber); }
  .domains { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .domains div { background: var(--card); border-radius: 8px; padding: 8px 10px; }
  .mismatch { color: var(--red); font-weight: 600; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  ul.clean { list-style: none; margin: 0; padding: 0; } ul.clean li { padding: 7px 0; border-top: 1px solid var(--line); }
  ul.clean li:first-child { border-top: 0; padding-top: 0; }
  .src { font: 11.5px ui-monospace, monospace; color: var(--muted); }
  .sources { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
  .sources .chip { font: 11px ui-monospace, monospace; }
  details { border-top: 1px solid var(--line); padding: 8px 0; } details:first-of-type { border-top: 0; }
  summary { cursor: pointer; font-weight: 600; } summary .count { color: var(--muted); font-weight: 400; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  th, td { text-align: left; padding: 6px 8px; border-top: 1px solid var(--line); } th { color: var(--muted); font-weight: 500; }
  pre.untrusted { white-space: pre-wrap; border-left: 3px solid var(--amber); padding: 6px 10px; margin: 6px 0; font-size: 13px; }
  .finding-card { display: flex; gap: 10px; align-items: flex-start; }
  .finding-card img { width: 16px; height: 16px; margin-top: 3px; flex: none; }
  .checks label { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-top: 1px solid var(--line); }
  .checks label:first-child { border-top: 0; }
  .checks input:checked + span { color: var(--muted); text-decoration: line-through; }
  form.finding { display: grid; gap: 8px; } form.finding .row { display: flex; gap: 8px; }
  .empty { color: var(--muted); }
  button.ref { font: 11.5px ui-monospace, monospace; padding: 1px 7px; border-radius: 999px; background: var(--chip);
    border: 1px solid transparent; color: var(--accent); cursor: pointer; }
  button.ref:hover { border-color: var(--accent); }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); background: var(--card);
    border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0,0,0,.12); padding: 16px 18px; overflow: auto;
    transform: translateX(100%); transition: transform .18s ease; z-index: 5; }
  .drawer.open { transform: none; }
  .drawer h3 { margin: 0 0 4px; font: 600 15px ui-monospace, monospace; }
  .drawer dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 10px 0; font-size: 13px; }
  .drawer dt { color: var(--muted); } .drawer dd { margin: 0; word-break: break-word; }
  .drawer pre { white-space: pre-wrap; font-size: 12px; background: var(--chip); padding: 10px; border-radius: 8px; }
  .chat .log { max-height: 320px; overflow: auto; display: grid; gap: 8px; margin-bottom: 8px; }
  .chat .q { justify-self: end; background: var(--blue-bg); border-radius: 10px 10px 2px 10px; padding: 6px 10px; max-width: 90%; }
  .chat .a { background: var(--chip); border-radius: 10px 10px 10px 2px; padding: 6px 10px; max-width: 95%; white-space: pre-wrap; }
  .chat form { display: flex; gap: 6px; } .chat input { flex: 1; }
  .warn { color: var(--amber); }
  .why { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(160px, .8fr); gap: 0; padding: 0; margin-bottom: 14px; overflow: hidden; }
  .why > div { padding: 12px 14px; border-left: 1px solid var(--line); } .why > div:first-child { border-left: 0; }
  .why .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .why .answer { font-size: 15px; font-weight: 600; margin: 3px 0; }
  .why .ok .answer::before { content: "✓ "; color: var(--green); } .why .bad .answer::before { content: "! "; color: var(--red); }
  .why .bad { background: var(--amber-bg); }
  .why .verdict { background: var(--chip); }
  .inbox table { margin: 0; } .inbox tr.row { cursor: pointer; } .inbox tr.row:hover td { background: var(--chip); }
  .inbox td { vertical-align: top; } .inbox .reason { color: var(--muted); }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
  @media (max-width: 900px) { .hero, .layout, .two, .domains, .why { grid-template-columns: 1fr; } .why > div { border-left: 0; border-top: 1px solid var(--line); } .side { position: static; }
    .inbox .when, .inbox .reason-col { display: none; } }
</style>
</head>
<body>
<header class="bar">
  <div>
    <h1>Case review</h1>
    <p class="note">An AI assistant gathered and ordered this evidence. It decides nothing: you do. Payments are simulated.</p>
  </div>
  <form class="open" id="open">
    <input id="token" type="password" placeholder="Admin token" autocomplete="off" required>
    <input id="by" placeholder="Your name" required>
    <button class="primary">Open inbox</button>
    <span id="status" class="note"></span>
  </form>
</header>
<main id="case"><p class="empty">Enter the admin token from <code>.env</code> and your name once; the inbox opens.</p></main>
<aside class="drawer" id="drawer" aria-live="polite"></aside>

<script>
// Every value from the case is set as text, never as HTML: invoice text, rationale and web findings
// may be written by an attacker (security.md, S14). Images load only from a domain the research
// validated, through a favicon service, with no referrer.
const $ = (id) => document.getElementById(id);
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (key === "class") node.className = value; else if (key === "text") node.textContent = value; else node.setAttribute(key, value);
  }
  for (const child of children.flat()) if (child != null) node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  return node;
}
const money = (a) => a ? `${(a.amount / 100).toLocaleString(undefined, { minimumFractionDigits: 2 })} ${a.currency}` : "–";
const domainOf = (url) => { try { return new URL(url).hostname; } catch (e) { return null; } };
const favicon = (domain, size) => `https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=${size}`;
try { $("token").value = sessionStorage.getItem("zeta-admin") || ""; $("by").value = sessionStorage.getItem("zeta-by") || ""; } catch (e) {}
const RECORD_ID = /\b(?:dec|pay|adj|chl|bill|paid|cp|pm|pmc|pmh|txn|acct)_[A-Za-z0-9_]+/g;

// A record id as a link to its source: the record, the system it came from, and where it lives in production.
function ref(id) {
  const button = el("button", { class: "ref", type: "button", title: "Open the source record", text: id });
  button.addEventListener("click", () => openRecord(id));
  return button;
}
const isWeb = (url) => /^https?:\/\//i.test(url || "");
function linked(value) {  // text with every record id turned into a source link
  const text = String(value); const parts = []; let last = 0;
  for (const match of text.matchAll(RECORD_ID)) {
    parts.push(text.slice(last, match.index), ref(match[0])); last = match.index + match[0].length;
  }
  parts.push(text.slice(last));
  return el("span", {}, parts);
}
async function openRecord(id) {
  const drawer = $("drawer");
  drawer.replaceChildren(el("p", { class: "note", text: "Loading " + id + "…" })); drawer.classList.add("open");
  const close = el("button", { type: "button", text: "Close" }); close.addEventListener("click", () => drawer.classList.remove("open"));
  try {
    const found = await api("/v1/records/" + encodeURIComponent(id));
    const fields = Object.entries(found.record || {}).filter(([, v]) => v === null || typeof v !== "object");
    drawer.replaceChildren(close, el("h3", { text: id }),
      el("dl", {}, [["Source", found.source.system], ["Collection", found.source.collection], ["In production", found.source.production]]
        .flatMap(([k, v]) => [el("dt", { text: k }), el("dd", { text: v })])),
      el("h2", { class: "note", text: "Fields" }),
      el("dl", {}, fields.flatMap(([k, v]) => [el("dt", { text: k }), el("dd", {}, linked(v == null ? "–" : v))])),
      el("details", {}, el("summary", { text: "Full record" }), el("pre", { text: JSON.stringify(found.record, null, 2) })));
  } catch (e) { drawer.replaceChildren(close, el("p", { class: "warn", text: `Couldn't open ${id}: ${e.message}` })); }
}
document.addEventListener("keydown", (event) => { if (event.key === "Escape") $("drawer").classList.remove("open"); });

function logo(name, domain) {
  const initials = (name || "?").split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join("");
  let hue = 0; for (const c of name || "") hue = (hue * 31 + c.charCodeAt(0)) % 360;
  const box = el("div", { class: "logo", title: domain || "no domain found" });
  const monogram = () => { box.replaceChildren(initials); box.style.background = `hsl(${hue} 40% 42%)`; };
  if (domain) {
    const img = el("img", { alt: "", src: favicon(domain, 128), referrerpolicy: "no-referrer" });
    img.addEventListener("error", monogram);
    box.append(img);
  } else monogram();
  return box;
}

async function api(path, body) {
  const headers = { "Authorization": "Bearer " + $("token").value, "Content-Type": "application/json" };
  const response = await fetch(path, body ? { method: "POST", headers, body: JSON.stringify(body) } : { headers });
  const data = await response.json();
  if (!response.ok) throw new Error((data.error && data.error.message) || response.status);
  return data;
}

function card(title, ...children) { return el("section", { class: "card" }, el("h2", { text: title }), ...children); }
function list(items, render, empty = "None.") {
  return items && items.length ? el("ul", { class: "clean" }, items.map((item) => el("li", {}, render(item)))) : el("p", { class: "empty", text: empty });
}

function hero(c) {
  const ev = c.evidence, d = ev.decision, p = ev.proposal || {}, ctx = ev.context || {};
  const vendor = (ctx.counterparty || {}).name || p.counterparty_id || "Unknown payee";
  const official = c.research && c.research.official_domain;
  const outcomes = d.outcomes || [];
  const latest = outcomes[outcomes.length - 1];
  const floor = (d.risk || {}).floor;
  return el("div", { class: "hero" },
    el("section", { class: "card who" }, logo(vendor, official),
      el("div", {}, el("strong", { text: vendor }), el("span", { class: "note", text: official ? official : "Official domain not found" }))),
    el("section", { class: "card kpi" }, el("div", { class: "label", text: "Amount" }), el("div", { class: "value", text: money(p.amount) }),
      el("div", { class: "note" }, "to ", p.payment_method_id ? ref(p.payment_method_id) : "?", " · payee ", p.counterparty_id ? ref(p.counterparty_id) : "?")),
    el("section", { class: "card kpi" }, el("div", { class: "label", text: "Reported" }),
      el("div", { class: "value" }, latest ? el("span", { class: `badge ${!latest.verified ? "claim" : latest.finding === "legitimate" ? "allow" : "block"}`,
        text: `${latest.finding.replace("_", " ")}${latest.verified ? "" : " (claim)"}` }) : el("span", { class: "note", text: "No report yet" })),
      el("div", { class: "chips" }, floor ? floor.flags.map((f) => el("span", { class: "chip", text: f })) : el("span", { class: "note", text: "No floor at decision" }))));
}

function attention(c) {
  const f = c.case_file || {}, ctx = c.evidence.context || {};
  const official = c.research && c.research.official_domain;
  const onInvoice = (c.public_facts_searched || {}).domains_on_invoice || [];
  const mismatch = official && onInvoice.some((d) => !d.endsWith(official));
  const box = el("section", { class: "card attention" }, el("h2", { text: "Look here first" }));
  if (official || onInvoice.length) {
    box.append(el("div", { class: "domains" },
      el("div", {}, el("div", { class: "note", text: "Vendor's own domain (web research)" }), el("div", { text: official || "not found" })),
      el("div", {}, el("div", { class: "note", text: "Domains on the invoice" }),
        el("div", { class: mismatch ? "mismatch" : "", text: onInvoice.length ? onInvoice.join(", ") + (mismatch ? "  ≠ vendor" : "") : "none" }))));
  }
  box.append(list(f.contradictions, (x) => linked(x), "No contradictions found."));
  if ((f.open_questions || []).length) box.append(el("div", { class: "note", text: "Open questions" }), list(f.open_questions, (x) => linked(x)));
  return box;
}

function evidence(c) {
  const ev = c.evidence, p = ev.proposal || {}, ctx = ev.context || {};
  const section = (title, count, ...body) => el("details", {}, el("summary", {}, title, " ", el("span", { class: "count", text: `(${count})` })), ...body);
  const rows = (items, cols) => el("table", {}, el("tr", {}, cols.map(([h]) => el("th", { text: h }))),
    items.map((item) => el("tr", {}, cols.map(([, f]) => el("td", {}, linked(f(item)))))));
  const untrusted = [["Invoice", ctx.bill && ctx.bill.document_excerpt], ["Agent's rationale", p.agent_rationale], ["Memo", p.memo]].filter(([, t]) => t);
  return card("Evidence, on demand",
    section("Payments to this bank account", ev.payments_to_method.length,
      rows(ev.payments_to_method, [["Payment", (x) => x.payment_id], ["When", (x) => x.created_at.slice(0, 16).replace("T", " ")], ["Status", (x) => x.status], ["Payee", (x) => x.counterparty_id], ["Amount", (x) => money(x.amount)], ["Decision", (x) => x.decision_id]])),
    section("Payments to this payee", ev.payments_to_payee.length,
      rows(ev.payments_to_payee, [["Payment", (x) => x.id], ["When", (x) => String(x.posted_at).slice(0, 10)], ["Status", (x) => x.status || ""], ["Bill", (x) => x.bill_id || ""], ["Amount", (x) => money(x.amount)]])),
    section("Bank-detail changes", ev.method_changes.length,
      rows(ev.method_changes, [["Change", (x) => x.id], ["When", (x) => String(x.changed_at).slice(0, 10)], ["Kind", (x) => x.change], ["Method", (x) => x.method_id]])),
    section("Risk adjustments for this business", ev.adjustments.length,
      rows(ev.adjustments, [["Adjustment", (x) => x.adjustment_id], ["When", (x) => String(x.at).slice(0, 10)], ["Kind", (x) => x.kind], ["Subject", (x) => x.subject], ["From", (x) => x.decision_id || ""]])),
    section("Untrusted text (may be written by an attacker)", untrusted.length,
      untrusted.map(([label, text]) => [el("div", { class: "note", text: label }), el("pre", { class: "untrusted", text })])));
}

function web(c) {
  const findings = (c.research && c.research.findings) || [];
  return card("Web findings · untrusted, open the source",
    list(findings, (x) => {
      const domain = domainOf(x.url);
      return el("div", { class: "finding-card" }, domain ? el("img", { alt: "", src: favicon(domain, 32), referrerpolicy: "no-referrer" }) : null,
        el("div", {}, x.claim, el("div", {}, isWeb(x.url) ? el("a", { href: x.url, target: "_blank", rel: "noopener noreferrer", class: "src", text: x.url }) : el("span", { class: "src", text: x.url }))));
    }, c.research ? "Nothing found." : "Web research was not available for this case."));
}

function side(c) {
  const f = c.case_file || {}, d = c.evidence.decision;
  const checks = [...(f.next_steps || []), ...(f.missing_evidence || []).map((m) => "Get: " + m)];
  const key = `zeta-checks-${c.case_id}`;
  let done = []; try { done = JSON.parse(localStorage.getItem(key) || "[]"); } catch (e) {}
  const checklist = el("div", { class: "checks" }, checks.map((text, i) => {
    const box = el("input", { type: "checkbox" }); box.checked = done.includes(i);
    box.addEventListener("change", () => { done = box.checked ? [...done, i] : done.filter((n) => n !== i);
      try { localStorage.setItem(key, JSON.stringify(done)); } catch (e) {} });
    return el("label", {}, box, el("span", { text }));
  }));
  const form = el("form", { class: "finding" },
    el("select", { id: "f-finding" }, [["legitimate", "Legitimate"], ["payee_fraud", "Payee fraud"], ["manipulated_agent", "Manipulated agent"], ["unauthorized", "Unauthorized"]].map(([v, t]) => el("option", { value: v, text: t }))),
    el("select", { id: "f-verification", required: "" }, el("option", { value: "", text: "How did you verify it?" }), [["callback_known_number", "Called back on a number already on file"], ["bank_confirmation", "Bank confirmation"], ["vendor_portal", "Vendor portal"], ["signed_customer_attestation", "Signed customer attestation"], ["customer_report", "Customer report only (a claim)"], ["none", "Not verified"]].map(([v, t]) => el("option", { value: v, text: t }))),
    el("input", { id: "f-note", placeholder: "What you found, and from whom" }),
    el("div", { class: "row" }, el("button", { text: "Record finding" }), el("span", { id: "f-status", class: "note" })));
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    try {
      const o = await api(`/v1/decisions/${encodeURIComponent(d.decision_id)}/outcomes`, {
        finding: $("f-finding").value, verification: $("f-verification").value, by: $("by").value, note: $("f-note").value || null });
      $("f-status").textContent = o.verified ? "Recorded. A verified finding changes risk for this business." : "Recorded as a claim: it changes nothing.";
    } catch (e) { $("f-status").textContent = "Not recorded: " + e.message; }
  });
  const log = el("div", { class: "log" });
  const say = (q, a, extra) => { log.append(el("div", { class: "q", text: q }), el("div", { class: "a" }, linked(a), extra || null)); log.scrollTop = log.scrollHeight; };
  const input = el("input", { placeholder: "Ask about this case…", maxlength: "1000" });
  const ask = el("form", {}, input, el("button", { text: "Ask" }));
  ask.addEventListener("submit", async (event) => {
    event.preventDefault();
    const question = input.value.trim(); if (!question) return;
    input.value = ""; const pending = el("div", { class: "a note", text: "Thinking…" });
    log.append(el("div", { class: "q", text: question }), pending);
    try {
      const reply = await api(`/v1/cases/${encodeURIComponent(c.case_id)}/chat`, { question, by: $("by").value || "case worker" });
      where.textContent = reply.note + " It decides nothing.";
      pending.replaceWith(el("div", { class: "a" }, linked(reply.answer),
        reply.not_in_case.length ? el("div", { class: "warn", text: "Cited but not in this case: " + reply.not_in_case.join(", ") }) : null));
    } catch (e) { pending.replaceWith(el("div", { class: "a warn", text: e.message })); }
    log.scrollTop = log.scrollHeight;
  });
  const where = el("p", { class: "note", text: "A model answers from this case's evidence only and decides nothing. Each answer says where it ran." });
  api(`/v1/cases/${encodeURIComponent(c.case_id)}/chat`).then((turns) => turns.forEach((t) => say(t.question, t.answer))).catch(() => {});
  return el("aside", { class: "side" },
    card("Your checks", checks.length ? checklist : el("p", { class: "empty", text: "No checks suggested." })),
    el("section", { class: "card chat" }, el("h2", { text: "Ask about this case" }), log, ask,
      where),
    card("Record what you found", form, el("p", { class: "note", text: "Only a verified method changes risk. The assistant never records a finding." })));
}

function show(c) {
  const f = c.case_file || {};
  const facts = card("Shown by the records", list(f.verified_facts, (x) => [x.statement,
    el("div", { class: "sources" }, x.sources.map((s) => isWeb(s) ? el("a", { href: s, target: "_blank", rel: "noopener noreferrer", class: "src", text: s }) : ref(s)))], "No cited facts."));
  const inferences = card("Suggested, not shown", list(f.inferences, (x) => [linked(x.statement), el("div", { class: "note" }, linked(x.basis))], "No inferences."));
  const story = card("What happened", el("p", { class: "lead", text: f.summary || "The assistant couldn't write a summary; the evidence is below." }),
    (f.timeline || []).length ? el("ol", { class: "timeline" }, f.timeline.map((e) => el("li", {}, el("time", { text: e.at }), linked(e.event)))) : null);
  const modelsOff = (c.errors || []).some((e) => e.includes("ModelsOff"));
  const errors = modelsOff ? [el("p", { class: "note", text: "Models are off in this demo, so the assistant didn't research or summarise; the gathered records are below." })]
    : (c.errors || []).map((e) => el("p", { class: "warn", text: "Assistant: " + e }));
  $("case").replaceChildren(hero(c), ...errors,
    el("div", { class: "layout" },
      el("div", { class: "stack" }, attention(c), story, el("div", { class: "two" }, facts, inferences), web(c), evidence(c),
        el("p", { class: "note", text: c.note })),
      side(c)));
}

// The decision's three questions in plain words, from the record itself (no model).
function why(row) {
  const parts = Object.fromEntries(row.parts.map((part) => [part.question, part]));
  const column = (question, label) => {
    const part = parts[question];
    if (!part) return el("div", {}, el("div", { class: "label", text: label }), el("div", { class: "note", text: "Not reached" }));
    return el("div", { class: part.ok ? "ok" : "bad" }, el("div", { class: "label", text: label }),
      el("div", { class: "answer", text: part.text.charAt(0).toUpperCase() + part.text.slice(1) }),
      el("div", { class: "sources" }, part.evidence.map(ref)));
  };
  const timings = Object.entries(row.stages).map(([stage, ms]) => `${stage} ${ms} ms`).join(" · ");
  return el("section", { class: "card why" }, column("identity", "Who is acting"), column("authorization", "Authorized?"),
    column("risk", "About the payment"),
    el("div", { class: "verdict" }, el("div", { class: "label", text: "Engine decided" }),
      el("div", { class: "answer" }, el("span", { class: `badge ${row.decision}`, text: row.action }), " ", ref(row.decision_id)),
      el("div", { class: "note", text: `${timings}${row.models.length ? " · model: " + row.models.join(", ") : " · no model"}` })));
}

async function openRow(row) {
  const status = $("status");
  const back = el("button", { type: "button", text: "← Inbox" });
  back.addEventListener("click", () => { history.replaceState(null, "", location.pathname); loadInbox(); });
  let fromDemo = false; try { fromDemo = sessionStorage.getItem("zeta-demo") === "1"; } catch (e) {}
  const toolbar = () => el("div", { class: "toolbar" }, back, fromDemo ? el("a", { href: "/demo", text: "← Demo" }) : null,
    el("strong", { text: `${row.vendor} · ${money(row.amount)}` }));
  const progress = el("p", { class: "note" });
  $("case").replaceChildren(toolbar(), why(row), progress);
  try {
    let found;
    if (row.case_ids.length) found = await api("/v1/cases/" + encodeURIComponent(row.case_ids[row.case_ids.length - 1]));
    else {
      progress.textContent = "Gathering the records and researching the vendor on the web (about a minute)…";
      found = await api("/v1/cases", { decision_id: row.decision_id, by: $("by").value });
    }
    show(found);
    $("case").prepend(toolbar(), why(row));
    status.textContent = "";
  } catch (e) { progress.className = "warn"; progress.textContent = "Couldn't assemble the case: " + e.message; }
}

async function loadInbox() {
  const status = $("status");
  status.textContent = "Loading…";
  try {
    const rows = await api("/v1/inbox?limit=100");
    const attention = (row) => row.decision !== "allow" || (row.outcome && row.outcome.finding !== "legitimate");
    const table = el("table", {}, el("tr", {}, ["When", "Vendor", "Amount", "Decision", "Why", "Finding", "Case"].map((h, i) =>
      el("th", { class: i === 0 ? "when" : i === 4 ? "reason-col" : "", text: h }))),
      rows.map((row) => {
        const tr = el("tr", { class: "row", tabindex: "0" },
          el("td", { class: "when note", text: String(row.created_at || "").slice(0, 16).replace("T", " ") }),
          el("td", {}, el("strong", { text: row.vendor }), row.sandbox ? el("div", { class: "note", text: "scenario run" }) : null),
          el("td", { text: money(row.amount) }),
          el("td", {}, el("span", { class: `badge ${row.decision}`, text: row.action })),
          el("td", { class: "reason reason-col", text: row.parts[row.parts.length - 1].text }),
          el("td", {}, row.outcome ? el("span", { class: `badge ${!row.outcome.verified ? "claim" : row.outcome.finding === "legitimate" ? "allow" : "block"}`,
            text: row.outcome.finding.replace("_", " ") + (row.outcome.verified ? "" : " (claim)") }) : el("span", { class: "note", text: "–" })),
          el("td", { class: "note", text: row.case_ids.length ? "Ready" : (attention(row) ? "Assemble" : "–") }));
        tr.addEventListener("click", () => openRow(row));
        tr.addEventListener("keydown", (event) => { if (event.key === "Enter") openRow(row); });
        return tr;
      }));
    $("case").replaceChildren(el("section", { class: "card inbox" }, el("h2", { text: `Decisions (${rows.length})` }),
      rows.length ? table : el("p", { class: "empty", text: "No decisions yet. Run a scenario or the demo to make some." }),
      el("p", { class: "note", text: "Open a row to see its records. Opening one without a case file asks the assistant to assemble it, which calls a model." })));
    status.textContent = "";
    const wanted = rows.find((row) => row.decision_id === location.hash.slice(1));
    if (wanted) openRow(wanted);
  } catch (e) { status.textContent = "Couldn't load the inbox: " + e.message; }
}

$("open").addEventListener("submit", (event) => {
  event.preventDefault();
  try { sessionStorage.setItem("zeta-admin", $("token").value); sessionStorage.setItem("zeta-by", $("by").value); } catch (e) {}
  loadInbox();
});
if ($("token").value && $("by").value) loadInbox();
</script>
</body>
</html>
