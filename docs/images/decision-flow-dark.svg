<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1030" width="1160" height="1030" role="img" aria-labelledby="title desc">
<title id="title">Zeta One: rules, typed decisions, language models and human verification</title>
<desc id="desc">Identity and authorization are checked in code before risk rules. Rules can decide without models. The Jev configuration uses a typed decision model before deeper language-model review where needed; direct model configurations skip Jev. No model can override hard constraints. Policy allows, holds or blocks the simulated payment, always recording evidence. A case assistant helps a person review; verified findings create scoped, revocable adjustments for future decisions. Claims alone do not change trust.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#aab5c2"/></marker>
<marker id="feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#bc97ef"/></marker>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3}.title{font-size:16px;font-weight:600}.small{font-size:13px;fill:#aab5c2}.label{font-size:12px;fill:#aab5c2}.head{font-size:12px;letter-spacing:1px;font-weight:700;fill:#aab5c2}</style></defs>
<rect width="1160" height="1030" rx="12" fill="#0d1117"/>
<text x="60" y="28" class="head" text-anchor="start">THE DECISION</text>
<rect x="60" y="44" width="300" height="52" rx="8" fill="#212830" stroke="#9aa7b7" stroke-width="1.5"/>
<text x="75" y="68" class="title" text-anchor="start">Agent proposes a payment</text>
<text x="75" y="87" class="small" text-anchor="start">Signed payee, destination, amount, bill</text>
<rect x="60" y="126" width="300" height="60" rx="8" fill="#183351" stroke="#72a7e8" stroke-width="1.5"/>
<text x="75" y="150" class="title" text-anchor="start">1 · Verify the actor</text>
<text x="75" y="169" class="small" text-anchor="start">Registered key; valid, fresh signature</text>
<rect x="60" y="216" width="300" height="60" rx="8" fill="#183351" stroke="#72a7e8" stroke-width="1.5"/>
<text x="75" y="240" class="title" text-anchor="start">2 · Bound its authority</text>
<text x="75" y="259" class="small" text-anchor="start">Scope, limits, expiry and revocation</text>
<text x="385" y="151" class="small" text-anchor="start">Unknown, revoked or bad signature: block</text>
<text x="385" y="241" class="small" text-anchor="start">Outside the authorization: block</text>
<rect x="60" y="326" width="300" height="80" rx="8" fill="#183351" stroke="#72a7e8" stroke-width="1.5"/>
<text x="75" y="350" class="title" text-anchor="start">3 · Assess the action: rules</text>
<text x="75" y="369" class="small" text-anchor="start">Read business records and risk signals.</text>
<text x="75" y="386" class="small" text-anchor="start">Hard flags set a minimum risk level.</text>
<rect x="450" y="326" width="240" height="80" rx="8" fill="#123d39" stroke="#68c6b5" stroke-width="1.5"/>
<text x="465" y="350" class="title" text-anchor="start">Jev · typed decisions</text>
<text x="465" y="369" class="small" text-anchor="start">Fixed questions and probabilities.</text>
<text x="465" y="386" class="small" text-anchor="start">Optional, in the Jev configuration.</text>
<rect x="790" y="326" width="310" height="80" rx="8" fill="#342449" stroke="#bc97ef" stroke-width="1.5"/>
<text x="805" y="350" class="title" text-anchor="start">Language-model review</text>
<text x="805" y="369" class="small" text-anchor="start">Claude Opus or self-hosted Qwen.</text>
<text x="805" y="386" class="small" text-anchor="start">Deeper interpretation where needed.</text>
<path d="M210 96 V124" fill="none" stroke="#aab5c2" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M210 186 V214" fill="none" stroke="#aab5c2" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M210 276 V324" fill="none" stroke="#aab5c2" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M360 366 H448" fill="none" stroke="#aab5c2" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M690 366 H788" fill="none" stroke="#aab5c2" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="405" y="387" class="label" text-anchor="middle">Jev arm</text>
<text x="740" y="351" class="label" text-anchor="middle">escalate</text>
<path d="M360 338 H380 V306 H945 V324" fill="none" stroke="#aab5c2" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="620" y="300" class="label" text-anchor="middle">Direct model configurations skip Jev</text>
<rect x="60" y="476" width="1040" height="60" rx="8" fill="#183351" stroke="#72a7e8" stroke-width="1.5"/>
<text x="75" y="500" class="title" text-anchor="start">Policy · enforced in code</text>
<text x="75" y="519" class="small" text-anchor="start">Identity, authorization and risk determine the outcome. No model can override a hard constraint.</text>
<path d="M210 406 V474" fill="none" stroke="#aab5c2" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M570 406 V474" fill="none" stroke="#aab5c2" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M945 406 V474" fill="none" stroke="#aab5c2" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="220" y="447" class="label" text-anchor="start">No model needed</text>
<text x="580" y="447" class="label" text-anchor="start">When resolved</text>
<text x="935" y="438" class="label" text-anchor="middle">May lower soft signals,</text>
<text x="935" y="455" class="label" text-anchor="middle">never hard flags</text>
<rect x="60" y="586" width="260" height="60" rx="8" fill="#452323" stroke="#ed9090" stroke-width="1.5"/>
<text x="75" y="610" class="title" text-anchor="start">Block</text>
<text x="75" y="629" class="small" text-anchor="start">Do not execute</text>
<rect x="450" y="586" width="260" height="60" rx="8" fill="#1b3825" stroke="#7dc889" stroke-width="1.5"/>
<text x="465" y="610" class="title" text-anchor="start">Allow</text>
<text x="465" y="629" class="small" text-anchor="start">Payment execution is simulated</text>
<rect x="840" y="586" width="260" height="60" rx="8" fill="#403019" stroke="#e0b260" stroke-width="1.5"/>
<text x="855" y="610" class="title" text-anchor="start">Challenge</text>
<text x="855" y="629" class="small" text-anchor="start">Hold for human verification</text>
<path d="M190 536 V584" fill="none" stroke="#aab5c2" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M580 536 V584" fill="none" stroke="#aab5c2" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M970 536 V584" fill="none" stroke="#aab5c2" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M60 156 H40 V616 H58" fill="none" stroke="#aab5c2" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M60 246 H40" fill="none" stroke="#aab5c2" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="696" width="1040" height="56" rx="8" fill="#212830" stroke="#9aa7b7" stroke-width="1.5"/>
<text x="75" y="720" class="title" text-anchor="start">Evidence record · for every decision</text>
<text x="75" y="739" class="small" text-anchor="start">The action, identity, authorization, risk signals, source references, reasons and policy version.</text>
<path d="M190 646 V694" fill="none" stroke="#aab5c2" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M580 646 V694" fill="none" stroke="#aab5c2" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M970 646 V694" fill="none" stroke="#aab5c2" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="60" y="788" class="head" text-anchor="start">REVIEW AND FEEDBACK</text>
<rect x="60" y="826" width="330" height="80" rx="8" fill="#342449" stroke="#bc97ef" stroke-width="1.5"/>
<text x="75" y="850" class="title" text-anchor="start">Case review assistant</text>
<text x="75" y="869" class="small" text-anchor="start">Gathers records and researches sources.</text>
<text x="75" y="886" class="small" text-anchor="start">Helps a person; cannot decide or pay.</text>
<rect x="440" y="826" width="300" height="80" rx="8" fill="#44283f" stroke="#e795cb" stroke-width="1.5"/>
<text x="455" y="850" class="title" text-anchor="start">A person records a finding</text>
<text x="455" y="869" class="small" text-anchor="start">States what was verified and how.</text>
<text x="455" y="886" class="small" text-anchor="start">Claims alone change no trust.</text>
<rect x="790" y="826" width="310" height="80" rx="8" fill="#212830" stroke="#9aa7b7" stroke-width="1.5"/>
<text x="805" y="850" class="title" text-anchor="start">Scoped risk adjustment</text>
<text x="805" y="869" class="small" text-anchor="start">Block a method or confirm a change.</text>
<text x="805" y="886" class="small" text-anchor="start">Revocable; cited by future decisions.</text>
<path d="M225 752 V824" fill="none" stroke="#bc97ef" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#feedback)"/>
<text x="235" y="807" class="label" text-anchor="start">Disputed payment</text>
<path d="M590 752 V824" fill="none" stroke="#bc97ef" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#feedback)"/>
<text x="600" y="807" class="label" text-anchor="start">Human review</text>
<path d="M390 866 H438" fill="none" stroke="#bc97ef" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#feedback)"/>
<path d="M740 866 H788" fill="none" stroke="#bc97ef" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#feedback)"/>
<path d="M945 906 V936 H20 V366 H58" fill="none" stroke="#bc97ef" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#feedback)"/>
<text x="530" y="929" class="label" text-anchor="middle">A verified finding informs the next payment assessment</text>
<rect x="60" y="964" width="17" height="13" rx="3" fill="#183351" stroke="#72a7e8"/>
<text x="85" y="976" class="label" text-anchor="start">Code / rules</text>
<rect x="245" y="964" width="17" height="13" rx="3" fill="#123d39" stroke="#68c6b5"/>
<text x="270" y="976" class="label" text-anchor="start">Typed decision model</text>
<rect x="505" y="964" width="17" height="13" rx="3" fill="#342449" stroke="#bc97ef"/>
<text x="530" y="976" class="label" text-anchor="start">Language model</text>
<rect x="735" y="964" width="17" height="13" rx="3" fill="#44283f" stroke="#e795cb"/>
<text x="760" y="976" class="label" text-anchor="start">Person</text>
<rect x="900" y="964" width="17" height="13" rx="3" fill="#212830" stroke="#9aa7b7"/>
<text x="925" y="976" class="label" text-anchor="start">Input / record</text>
<path d="M60 1000 H90" fill="none" stroke="#aab5c2" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="100" y="1004" class="label" text-anchor="start">Decision path</text>
<path d="M270 1000 H300" fill="none" stroke="#bc97ef" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#feedback)"/>
<text x="310" y="1004" class="label" text-anchor="start">Review / feedback</text>
<text x="1100" y="1004" class="label" text-anchor="end">Payments are simulated.</text>
</svg>
