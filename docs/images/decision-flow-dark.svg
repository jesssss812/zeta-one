<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" width="1100" height="760" role="img" aria-labelledby="title desc">
<title id="title">How Zeta One decides on an agent's payment</title>
<desc id="desc">A signed payment proposal is checked for identity, then authorization, then risk rules (tier 0). Uncertain cases below a high floor go to a model, which may lower only soft signals. The policy returns block, allow (simulated payment) or challenge, each with an evidence record. A person records what turned out to be true; a verified finding becomes an append-only risk adjustment that the next decision cites, and a feedback case for the evaluation; a claim alone changes nothing.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a8b3bf"/></marker>
<marker id="loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b69cf0"/></marker>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.t { font-size: 15px; font-weight: 600; fill: #e6edf3; }
.s { font-size: 12.5px; fill: #a8b3bf; }
.e { font-size: 12px; fill: #a8b3bf; }
.eb { font-size: 12px; fill: #f0706a; font-weight: 600; }
.h { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; fill: #a8b3bf; }
.l { stroke: #a8b3bf; stroke-width: 1.6; }
.ld { stroke: #b69cf0; stroke-width: 1.6; }
</style>
</defs>
<rect width="1100" height="760" rx="12" fill="#0d1117"/>
<text x="70" y="30" class="h" text-anchor="start">THE DECISION</text>
<text x="720" y="180" class="h" text-anchor="start">THE FEEDBACK LOOP</text>
<rect x="70" y="44" width="320" height="52" rx="8" fill="#1f242b" stroke="#8b949e" stroke-width="1.6"/>
<text x="84" y="66" class="t">Agent proposes a payment</text>
<text x="84" y="84" class="s">signed request: payee, method, amount, bill</text>
<rect x="70" y="126" width="320" height="60" rx="8" fill="#132a4d" stroke="#6ea0f0" stroke-width="1.6"/>
<text x="84" y="152" class="t">1 · Verify the actor</text>
<text x="84" y="170" class="s">Ed25519 signature, registered and active</text>
<text x="400" y="151" class="eb" text-anchor="start">unknown, revoked or</text>
<text x="400" y="166" class="eb" text-anchor="start">bad signature: block</text>
<rect x="70" y="216" width="320" height="60" rx="8" fill="#132a4d" stroke="#6ea0f0" stroke-width="1.6"/>
<text x="84" y="242" class="t">2 · Bound its authority</text>
<text x="84" y="260" class="s">scope, limits, expiry, revocation</text>
<text x="400" y="241" class="eb" text-anchor="start">outside what was</text>
<text x="400" y="256" class="eb" text-anchor="start">granted: block</text>
<rect x="70" y="306" width="320" height="68" rx="8" fill="#132a4d" stroke="#6ea0f0" stroke-width="1.6"/>
<text x="84" y="328" class="t">3 · Assess the action: tier 0</text>
<text x="84" y="345" class="s">risk rules on the vendor's records;</text>
<text x="84" y="362" class="s">hard flags set a floor</text>
<rect x="450" y="306" width="230" height="68" rx="8" fill="#2a1d47" stroke="#a98be8" stroke-width="1.6"/>
<text x="464" y="328" class="t">Model review</text>
<text x="464" y="345" class="s">Claude Opus 5.5; Jev first</text>
<text x="464" y="362" class="s">or an open-weight model</text>
<rect x="70" y="424" width="610" height="50" rx="8" fill="#132a4d" stroke="#6ea0f0" stroke-width="1.6"/>
<text x="84" y="446" class="t">Policy</text>
<text x="84" y="462" class="s">identity, authorization and risk in, one decision out</text>
<rect x="70" y="526" width="180" height="56" rx="8" fill="#421614" stroke="#f0706a" stroke-width="1.6"/>
<text x="84" y="559" class="t">Block</text>
<rect x="285" y="526" width="180" height="56" rx="8" fill="#12351a" stroke="#57c26a" stroke-width="1.6"/>
<text x="299" y="550" class="t">Allow</text>
<text x="299" y="568" class="s">payment simulated</text>
<rect x="500" y="526" width="180" height="56" rx="8" fill="#3d2a08" stroke="#e0a030" stroke-width="1.6"/>
<text x="514" y="550" class="t">Challenge</text>
<text x="514" y="568" class="s">held for a person</text>
<rect x="70" y="626" width="610" height="50" rx="8" fill="#1f242b" stroke="#8b949e" stroke-width="1.6"/>
<text x="84" y="648" class="t">Evidence record, for every decision</text>
<text x="84" y="664" class="s">what was verified, what was authorized, what was judged, and why</text>
<path d="M230 96 V124" fill="none" class="l" marker-end="url(#arr)"/>
<path d="M230 186 V214" fill="none" class="l" marker-end="url(#arr)"/>
<path d="M230 276 V304" fill="none" class="l" marker-end="url(#arr)"/>
<path d="M390 340 H448" fill="none" class="l" marker-end="url(#arr)"/>
<text x="419" y="357" class="e" text-anchor="middle">uncertain</text>
<path d="M230 374 V422" fill="none" class="l" marker-end="url(#arr)"/>
<text x="238" y="402" class="e" text-anchor="start">clear: no model</text>
<path d="M565 374 V422" fill="none" class="l" marker-end="url(#arr)"/>
<text x="573" y="396" class="e" text-anchor="start">may lower soft signals,</text>
<text x="573" y="411" class="e" text-anchor="start">never a hard flag</text>
<path d="M70 156 H44 V554 H68" fill="none" class="l" marker-end="url(#arr)"/>
<path d="M70 246 H44" fill="none" class="l"/>
<path d="M160 474 V524" fill="none" class="l" marker-end="url(#arr)"/>
<path d="M375 474 V524" fill="none" class="l" marker-end="url(#arr)"/>
<path d="M590 474 V524" fill="none" class="l" marker-end="url(#arr)"/>
<path d="M160 582 V624" fill="none" class="l" marker-end="url(#arr)"/>
<path d="M375 582 V624" fill="none" class="l" marker-end="url(#arr)"/>
<path d="M590 582 V624" fill="none" class="l" marker-end="url(#arr)"/>
<rect x="720" y="526" width="360" height="56" rx="8" fill="#2a1d47" stroke="#a98be8" stroke-width="1.6"/>
<text x="734" y="550" class="t">Case review assistant</text>
<text x="734" y="568" class="s">gathers records, researches the vendor; no verdict</text>
<rect x="720" y="424" width="360" height="50" rx="8" fill="#3d1532" stroke="#e07ac0" stroke-width="1.6"/>
<text x="734" y="446" class="t">A person records what was true</text>
<text x="734" y="462" class="s">and how it was verified</text>
<rect x="720" y="306" width="220" height="68" rx="8" fill="#1f242b" stroke="#8b949e" stroke-width="1.6"/>
<text x="734" y="328" class="t">Risk adjustment</text>
<text x="734" y="345" class="s">append-only, scoped to</text>
<text x="734" y="362" class="s">the business; cited next time</text>
<rect x="960" y="306" width="120" height="68" rx="8" fill="#1f242b" stroke="#8b949e" stroke-width="1.6"/>
<text x="974" y="328" class="t">Claim only</text>
<text x="974" y="345" class="s">kept; changes</text>
<text x="974" y="362" class="s">nothing</text>
<rect x="720" y="196" width="220" height="56" rx="8" fill="#132a4d" stroke="#6ea0f0" stroke-width="1.6"/>
<text x="734" y="220" class="t">Evaluation</text>
<text x="734" y="238" class="s">verified outcomes as cases</text>
<path d="M680 651 H700 V554 H718" fill="none" class="ld" stroke-dasharray="6 5" marker-end="url(#loop)"/>
<text x="712" y="606" class="e" text-anchor="start">a customer disputes a payment</text>
<path d="M900 526 V476" fill="none" class="ld" stroke-dasharray="6 5" marker-end="url(#loop)"/>
<path d="M650 526 V500 H705 V449 H718" fill="none" class="ld" stroke-dasharray="6 5" marker-end="url(#loop)"/>
<path d="M830 424 V376" fill="none" class="ld" stroke-dasharray="6 5" marker-end="url(#loop)"/>
<text x="838" y="402" class="e" text-anchor="start">verified finding</text>
<path d="M1020 424 V376" fill="none" class="ld" stroke-dasharray="6 5" marker-end="url(#loop)"/>
<text x="1012" y="402" class="e" text-anchor="end">claim</text>
<path d="M830 306 V254" fill="none" class="ld" stroke-dasharray="6 5" marker-end="url(#loop)"/>
<text x="838" y="286" class="e" text-anchor="start">feedback cases</text>
<path d="M760 306 V290 H420 V316 H392" fill="none" class="ld" stroke-dasharray="6 5" marker-end="url(#loop)"/>
<text x="430" y="284" class="e" text-anchor="start">next payment to that account or bank change</text>
<rect x="70" y="712" width="18" height="14" rx="3" fill="#132a4d" stroke="#6ea0f0" stroke-width="1.4"/>
<text x="96" y="724" class="s" text-anchor="start">Code, deterministic</text>
<rect x="240" y="712" width="18" height="14" rx="3" fill="#2a1d47" stroke="#a98be8" stroke-width="1.4"/>
<text x="266" y="724" class="s" text-anchor="start">A model</text>
<rect x="410" y="712" width="18" height="14" rx="3" fill="#3d1532" stroke="#e07ac0" stroke-width="1.4"/>
<text x="436" y="724" class="s" text-anchor="start">A person</text>
<rect x="580" y="712" width="18" height="14" rx="3" fill="#1f242b" stroke="#8b949e" stroke-width="1.4"/>
<text x="606" y="724" class="s" text-anchor="start">Input or record</text>
<rect x="750" y="712" width="18" height="14" rx="3" fill="#12351a" stroke="#57c26a" stroke-width="1.4"/>
<text x="776" y="724" class="s" text-anchor="start">Allow</text>
<rect x="842" y="712" width="18" height="14" rx="3" fill="#3d2a08" stroke="#e0a030" stroke-width="1.4"/>
<text x="868" y="724" class="s" text-anchor="start">Challenge</text>
<rect x="950" y="712" width="18" height="14" rx="3" fill="#421614" stroke="#f0706a" stroke-width="1.4"/>
<text x="976" y="724" class="s" text-anchor="start">Block</text>
<path d="M70 738 H100" class="l" marker-end="url(#arr)"/>
<text x="108" y="742" class="s" text-anchor="start">decision path</text>
<path d="M240 738 H270" class="ld" stroke-dasharray="6 5" marker-end="url(#loop)"/>
<text x="278" y="742" class="s" text-anchor="start">feedback loop, after the decision</text>
<text x="1080" y="742" class="s" text-anchor="end">Payments are simulated.</text>
</svg>
